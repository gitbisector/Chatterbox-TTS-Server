server:
  host: 0.0.0.0
  port: 8004
  use_ngrok: false
  use_auth: false
  auth_username: user
  auth_password: password
  log_file_path: logs/tts_server.log
  log_file_max_size_mb: 10
  log_file_backup_count: 5
  ssl_certfile: null
  ssl_keyfile: null
model:
  repo_id: chatterbox-multilingual
tts_engine:
  device: cuda
  predefined_voices_path: voices
  reference_audio_path: reference_audio
  default_voice_id: Emily.wav
  onnx_cfm_steps: 4
  # LM forward-pass backend. "ort" = fp16 ONNX via onnxruntime (default;
  # matches pre-Phase-2d behaviour). "trt" = INT8 TensorRT engine via
  # engine_trt_lm — ~2x faster decode on Blackwell, requires tensorrt +
  # cuda-python at runtime and a prebuilt .engine file (arch-specific).
  lm_backend: ort
  # Path to the TRT engine, used only when lm_backend = trt. Relative paths
  # resolve against CHATTERBOX_ONNX_DIR (the directory holding the v2 ONNX
  # graphs); absolute paths are used as-is.
  lm_engine_path: trt-int8/language_model_v2.fp16.engine
paths:
  model_cache: model_cache
  output: outputs
generation_defaults:
  temperature: 0.4
  exaggeration: 0.8
  cfg_weight: 0.5
  seed: 0
  speed_factor: 1.0
  language: en
streaming:
  # Latency budget for the first audio chunk. Engine derives chunk_tokens (K1)
  # from this using measured LM step + vocoder cost. 800 ms is a conservative
  # default on DGX Spark (K1 ~= 40 tokens ~= 1.6 s of audio).
  first_chunk_budget_ms: 800
  # Crossfade (ms) at the chunk1/chunk2 boundary to mask CFM noise differences.
  crossfade_ms: 30
  # Optional override: force a specific K1. Leave null to let the budget drive it.
  first_chunk_tokens_override: null
denoise:
  # Phase 2a: run the vocoder output through RNNoise to remove low-frequency
  # rumble and high-frequency hiss. Pure-CPU, a few ms per second of audio on
  # ARM. RNNoise takes tuples (vad, frame) — the frame is a (1, 480) int16 per
  # 10 ms at 48 kHz. 2× resample is done in ~3-tap linear-interpolation to
  # keep memory flat (scipy's FIR designs blow up on long arrays in some
  # edge cases).
  enabled: true
  # Only mode implemented today is rnnoise; kept for future extensibility.
  mode: rnnoise

# Phase 2b: best-of-N batched through the LM at batch=2N (adjacent cond/uncond
# pairs per candidate), Whisper-scored, best picked. Only affects /tts.
#
# Default is N=1 because the steady-state cost per utterance is dominated by
# the serial vocoder + per-candidate Whisper validation — /tts total time goes
# from ~1.7 s to 5-9 s, which is too slow for interactive use. Clients that
# want the quality uplift can opt in per-request via the `n_candidates` field
# on CustomTTSRequest. Bump this to 3 globally once precision-down work
# (Phase 2d-2e FP8) cuts decode+vocode cost to where N=3 is practical.
n_candidates: 1
candidate_validation_threshold: 0.70

whisper:
  # Reach the Whisper container via the host gateway — chatterbox is on a
  # separate Docker network. 172.20.0.1 is the gateway of `containers_default`
  # (the bridge chatterbox sits on) and forwards to the host's port 9001.
  host: 172.20.0.1
  port: 9001
audio_output:
  format: wav
  sample_rate: 24000
  max_reference_duration_sec: 30
  save_to_disk: false
ui_state:
  last_text: Jazeker! Met Amsterdam.wav should spreken we Nederlands. Ik zal vanaf
    nu in het Nederlands antwoorden.
  last_voice_mode: clone
  last_predefined_voice: Jeremiah.wav
  last_reference_file: Amsterdam.wav
  last_seed: 2025
  last_chunk_size: 240
  last_split_text_enabled: true
  hide_chunk_warning: false
  hide_generation_warning: true
  theme: light
  last_preset_name: Motivational Speech
ui:
  title: Chatterbox TTS Server
  show_language_select: true
  max_predefined_voices_in_dropdown: 50
debug:
  save_intermediate_audio: false
